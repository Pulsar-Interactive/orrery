<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pair a phone · Orrery</title>
<!-- Opened on the computer by the Orrery component's Show QR button. {{URL}} and {{CODE}} are
     filled in by orrery_settings.py. The QR library needs the internet; the address and code
     below it work without. -->
<style>
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0E1214; color: #E8EDEF;
  font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 24px; box-sizing: border-box; }
main { display: grid; gap: 20px; justify-items: center; text-align: center; max-width: 420px; }
.word { font-weight: 700; font-size: 13px; letter-spacing: .3em; color: #4FD3DE; }
h1 { margin: 0; font-size: 28px; }
#qr { background: #fff; padding: 16px; border-radius: 12px; line-height: 0; }
#qr:empty { display: none; }
p { margin: 0; color: #9AA6AB; }
.addr { font: 500 18px ui-monospace, Menlo, monospace; color: #E8EDEF; word-break: break-all; }
.code { font: 600 32px ui-monospace, Menlo, monospace; letter-spacing: .3em; color: #E8EDEF; }
</style>
</head>
<body>
<main>
  <span class="word">ORRERY</span>
  <h1>Scan with your phone's camera</h1>
  <div id="qr"></div>
  <p>Or open this address on the phone and enter the code:</p>
  <div class="addr">{{ADDRESS}}</div>
  <div class="code">{{CODE}}</div>
  <p>The phone must be on the same network as this computer.</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha384-3zSEDfvllQohrq0PHL1fOXJuC/jSOO34H46t6UQfobFOmxE5BpjjaIJY5F2/bMnU" crossorigin="anonymous"></script>
<script>
if (window.QRCode) new QRCode(document.getElementById('qr'), { text: '{{URL}}', width: 260, height: 260, correctLevel: QRCode.CorrectLevel.M });
</script>
</body>
</html>
