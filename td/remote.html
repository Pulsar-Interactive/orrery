<title>Orrery</title>
<!-- Orrery: the phone remote. The Orrery component serves this page and talks to it over a
     WebSocket on the same address. One file, no build step. System fonts on purpose: the page
     must load from TouchDesigner alone, on venue networks with no internet. -->
<style>
:root {
  --page: #0E1214; --raised: #161B1E; --line: #2A3236; --primary: #E8EDEF; --secondary: #9AA6AB;
  --brand: #4FD3DE; --onbrand: #062124; --tint: rgba(79,211,222,0.12); --error: #F08A80;
  --errtint: rgba(240,138,128,0.14);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--page); color: var(--primary); }
body {
  font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  padding: 0 max(16px, env(safe-area-inset-right)) max(96px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  max-width: 560px; margin: 0 auto; user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, .slider:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
header { position: sticky; top: 0; z-index: 2; background: var(--page); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; padding: max(16px, env(safe-area-inset-top)) 0 12px; }
.word { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 13px; letter-spacing: .3em; color: var(--brand); }
/* The Orrery mark (assets/brand/orrery-mark-mono.svg) as a mask, so it takes the text colour. */
.word::before { content: ""; width: 20px; height: 20px; flex: none; background: currentColor; -webkit-mask: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%22-6%20-6%20112%20112%22%20fill%3D%22none%22%20role%3D%22img%22%20aria-label%3D%22Orrery%22%3E%3Ctitle%3EOrrery%3C%2Ftitle%3E%3Cmask%20id%3D%22ecl-cut%22%20maskUnits%3D%22userSpaceOnUse%22%20x%3D%22-10%22%20y%3D%22-10%22%20width%3D%22120%22%20height%3D%22120%22%3E%3Crect%20x%3D%22-10%22%20y%3D%22-10%22%20width%3D%22120%22%20height%3D%22120%22%20fill%3D%22%23fff%22%3E%3C%2Frect%3E%3Ccircle%20cx%3D%2275%22%20cy%3D%2226%22%20r%3D%2216.5%22%20fill%3D%22%23000%22%3E%3C%2Fcircle%3E%3C%2Fmask%3E%3Ccircle%20cx%3D%2245%22%20cy%3D%2255%22%20r%3D%2231%22%20fill%3D%22%23000%22%20mask%3D%22url%28%23ecl-cut%29%22%3E%3C%2Fcircle%3E%3Ccircle%20cx%3D%2275%22%20cy%3D%2226%22%20r%3D%2213%22%20fill%3D%22%23000%22%3E%3C%2Fcircle%3E%3C%2Fsvg%3E") center / contain no-repeat; mask: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%22-6%20-6%20112%20112%22%20fill%3D%22none%22%20role%3D%22img%22%20aria-label%3D%22Orrery%22%3E%3Ctitle%3EOrrery%3C%2Ftitle%3E%3Cmask%20id%3D%22ecl-cut%22%20maskUnits%3D%22userSpaceOnUse%22%20x%3D%22-10%22%20y%3D%22-10%22%20width%3D%22120%22%20height%3D%22120%22%3E%3Crect%20x%3D%22-10%22%20y%3D%22-10%22%20width%3D%22120%22%20height%3D%22120%22%20fill%3D%22%23fff%22%3E%3C%2Frect%3E%3Ccircle%20cx%3D%2275%22%20cy%3D%2226%22%20r%3D%2216.5%22%20fill%3D%22%23000%22%3E%3C%2Fcircle%3E%3C%2Fmask%3E%3Ccircle%20cx%3D%2245%22%20cy%3D%2255%22%20r%3D%2231%22%20fill%3D%22%23000%22%20mask%3D%22url%28%23ecl-cut%29%22%3E%3C%2Fcircle%3E%3Ccircle%20cx%3D%2275%22%20cy%3D%2226%22%20r%3D%2213%22%20fill%3D%22%23000%22%3E%3C%2Fcircle%3E%3C%2Fsvg%3E") center / contain no-repeat; }
.back { color: var(--brand); min-height: 44px; padding-right: 16px; }
.dot { font-size: 11px; letter-spacing: .08em; color: var(--secondary); display: flex; align-items: center; gap: 6px; }
.dot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--secondary); }
.dot.live { color: var(--brand); } .dot.live::before { background: var(--brand); }
.dot.off { color: var(--error); } .dot.off::before { background: var(--error); }
.banner { flex-basis: 100%; margin: 0; padding: 12px 14px; border-radius: 8px; background: var(--errtint); border: 1px solid var(--error); color: var(--error); font-size: 15px; font-weight: 600; }
body.offline main { opacity: .35; pointer-events: none; }
.card { background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 16px; }
h1 { font-size: 24px; line-height: 32px; margin: 0; }
.group { font-size: 11px; letter-spacing: .08em; color: var(--secondary); padding-top: 8px; }
.hint { font-size: 13px; line-height: 20px; color: var(--secondary); margin: 0; }
.error { color: var(--error); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 28px; }
.ro { color: var(--secondary); text-align: right; overflow-wrap: anywhere; max-width: 60%; }
.ctl { display: grid; gap: 6px; }
.list button { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 56px; text-align: left; border-top: 1px solid var(--line); }
.list button:first-child { border-top: 0; }
.list .chev { color: var(--secondary); }
.onair { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--onbrand); background: var(--brand); border-radius: 4px; padding: 2px 6px; margin-left: 8px; vertical-align: middle; }
.val { font-variant-numeric: tabular-nums; color: var(--secondary); }
.reset { font-size: 13px; color: var(--brand); padding: 8px 0 8px 12px; }
.toggle { width: 100%; min-height: 44px; text-align: left; }
.switch { width: 50px; height: 30px; border-radius: 15px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--primary); transition: transform .15s; }
.toggle[aria-checked=true] .switch { background: var(--brand); }
.toggle[aria-checked=true] .switch::after { transform: translateX(20px); }
/* Slider: vertical swipes scroll the page, only a sideways drag changes the value, and a tap does nothing. */
.slider { position: relative; height: 44px; touch-action: pan-y; --p: 0; }
.slider::before { content: ""; position: absolute; left: 0; right: 0; top: 20px; height: 4px; border-radius: 2px; background: var(--line); }
.slider .fill { position: absolute; left: 0; top: 20px; height: 4px; border-radius: 2px; background: var(--brand); width: calc(var(--p) * 100%); }
.slider .thumb { position: absolute; top: 8px; width: 28px; height: 28px; border-radius: 50%; background: var(--primary); left: calc(var(--p) * (100% - 28px)); transition: transform .1s; }
.slider.active .thumb { transform: scale(1.15); background: var(--brand); }
.btns { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.ghost { border: 1px solid var(--line); border-radius: 6px; padding: 13px; min-height: 48px; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; touch-action: none; }
.ghost.down { background: var(--tint); border-color: var(--brand); color: var(--brand); }
.segs { display: flex; flex-wrap: wrap; gap: 6px; }
.segs button { flex: 1 1 auto; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; }
.segs button[aria-pressed=true] { background: var(--tint); border-color: var(--brand); color: var(--brand); }
.step { display: flex; align-items: center; gap: 12px; }
.step button { width: 52px; height: 44px; border: 1px solid var(--line); border-radius: 6px; font-size: 20px; }
.step .val { flex: 1; text-align: center; color: var(--primary); font-size: 18px; }
.code { font: 600 28px/1 ui-monospace, Menlo, monospace; letter-spacing: .3em; text-align: center; width: 100%; padding: 14px 8px; background: var(--page); color: var(--primary); border: 1px solid var(--line); border-radius: 6px; }
.primary { background: var(--brand); color: var(--onbrand); border-radius: 6px; padding: 14px; font-size: 14px; font-weight: 600; letter-spacing: .06em; }
.primary:disabled { opacity: .4; }
#toast { position: fixed; z-index: 3; left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); max-width: 528px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 6px 6px 16px; min-height: 56px; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
#toast.err { border-color: var(--error); color: var(--error); }
#toast .undo { color: var(--brand); font-weight: 600; min-height: 44px; padding: 0 16px; }
.footer { text-align: center; margin-top: 24px; }
.footer a { color: var(--secondary); font-size: 12px; text-decoration: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <span id="left"><span class="word">ORRERY</span></span>
  <span id="status" class="dot">CONNECTING</span>
  <p id="banner" class="banner" role="alert" hidden>Not connected to TouchDesigner. Retrying…</p>
</header>
<main id="main"></main>
<p class="footer"><a href="https://github.com/Pulsar-Interactive/orrery" target="_blank" rel="noopener">Orrery · free and open source · Pulsar Interactive</a></p>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
'use strict';
const KEY = 'orrery-code';
const main = document.getElementById('main');
const left = document.getElementById('left');
const statusEl = document.getElementById('status');
const banner = document.getElementById('banner');
const toastEl = document.getElementById('toast');

const store = {
  get() { try { return localStorage.getItem(KEY); } catch { return null; } },
  set(v) { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch {} },
};

// A code in the address (from the QR) is saved, then dropped from the address bar.
const fromUrl = new URLSearchParams(location.search).get('code');
if (fromUrl) { store.set(fromUrl); history.replaceState(null, '', location.pathname); }
let code = store.get();

let ws = null, retry = null, project = '', live = '', patches = [], current = null, panel = null, lastSet = '';

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'class') e.className = v;
    else e.setAttribute(k, v);
  }
  e.append(...kids.filter((k) => k != null));
  return e;
}

// Connected: controls work. Offline: a banner says so and every control is locked, so nothing
// on the phone pretends a change reached TouchDesigner.
function setStatus(live) {
  statusEl.hidden = false;
  statusEl.className = live ? 'dot live' : 'dot off';
  statusEl.textContent = live ? 'CONNECTED' : 'OFFLINE';
  banner.hidden = live;
  document.body.classList.toggle('offline', !live);
}

let toastTimer = null;
function toast(text, undo, err) {
  clearTimeout(toastTimer);
  toastEl.className = err ? 'err' : '';
  toastEl.replaceChildren(el('span', {}, text),
    undo ? el('button', { class: 'undo', onclick: () => { undo(); toastEl.hidden = true; } }, 'Undo') : null);
  toastEl.hidden = false;
  toastTimer = setTimeout(() => { toastEl.hidden = true; }, err ? 6000 : 5000);
}

function send(msg) {
  if (ws && ws.readyState === 1) { ws.send(JSON.stringify(msg)); return true; }
  return false;
}

function connect() {
  clearTimeout(retry);
  if (!code) return showPair('');
  ws = new WebSocket(`ws://${location.host}/?code=${encodeURIComponent(code)}`);
  ws.onopen = () => { setStatus(true); send({ type: 'list' }); if (current) send({ type: 'get', op: current }); };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'denied') {
      code = null; store.set(null); ws.onclose = null; ws.close();
      return showPair('That code was not accepted. Enter the Pairing Code shown on the Orrery component.');
    }
    if (msg.type === 'list') {
      project = msg.project; live = msg.live || ''; patches = msg.patches;
      if (!current) showList();
      else document.getElementById('onair')?.toggleAttribute('hidden', current !== live);
    }
    if (msg.type === 'state' && msg.op === current) showPanel(msg);
    if (msg.type === 'error') {
      if (current && msg.error.startsWith('nothing to control')) { current = null; showList(); return; }
      toast(`Couldn't change ${lastSet || 'that'}. ${msg.error}`, null, true);
      if (current) send({ type: 'get', op: current }); // put the controls back to TouchDesigner's values
    }
  };
  ws.onclose = () => { setStatus(false); retry = setTimeout(connect, 2000); };
}

// Phones lock and drop the socket: reconnect as soon as the page is back.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && code && (!ws || ws.readyState > 1)) connect();
});

// Keep the screen on while the remote is in use (where the browser allows it).
document.addEventListener('pointerdown', () => { navigator.wakeLock?.request('screen').catch(() => {}); }, { once: true });

function showPair(error) {
  current = null; panel = null;
  statusEl.hidden = true; banner.hidden = true; document.body.classList.remove('offline');
  left.replaceChildren(el('span', { class: 'word' }, 'ORRERY'));
  const input = el('input', { id: 'code', class: 'code', inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: '6', placeholder: '······', 'aria-label': 'Pairing code' });
  const go = el('button', { class: 'primary', disabled: '' }, 'CONNECT');
  input.addEventListener('input', () => { input.value = input.value.replace(/\D/g, ''); go.disabled = input.value.length !== 6; });
  const submit = () => {
    if (input.value.length !== 6) return;
    code = input.value; store.set(code);
    statusEl.hidden = false; statusEl.className = 'dot'; statusEl.textContent = 'CONNECTING';
    connect();
  };
  go.addEventListener('click', submit);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
  main.replaceChildren(el('div', { class: 'card' },
    el('h1', {}, 'Pair this phone'),
    error ? el('p', { class: 'hint error' }, error) : el('p', { class: 'hint' }, 'Enter the Pairing Code shown on the Orrery component in TouchDesigner, or scan its QR code.'),
    input, go));
  input.focus();
}

function showList() {
  panel = null;
  left.replaceChildren(el('span', { class: 'word' }, 'ORRERY'));
  const items = patches.map((p) => el('button', { onclick: () => open(p.op) },
    el('span', {}, p.label, p.op === live ? el('span', { class: 'onair' }, 'ON AIR') : null),
    el('span', { class: 'chev', 'aria-hidden': 'true' }, '›')));
  main.replaceChildren(el('div', { class: 'card' },
    el('h1', {}, project || 'Controls'),
    items.length ? el('div', { class: 'list' }, ...items)
      : el('p', { class: 'hint' }, 'Nothing to control yet. In TouchDesigner, add a custom parameter page named Controls to a COMP next to the Orrery component.')));
}

function open(op) {
  current = op;
  send({ type: 'get', op });
}

function back() {
  current = null;
  showList();
  scrollTo(0, 0);
  send({ type: 'list' });
}

// Rebuilt only when the set of controls changes; otherwise each control updates in place, so a
// change from TouchDesigner never yanks a slider out from under a finger.
function showPanel(msg) {
  const sig = msg.op + '|' + msg.controls.map((c) => c.name + ':' + c.style).join(',');
  if (panel && panel.sig === sig) { msg.controls.forEach((c, i) => panel.updates[i](c)); return; }
  const label = (patches.find((p) => p.op === msg.op) || {}).label || msg.op;
  left.replaceChildren(el('button', { class: 'back', onclick: back, 'aria-label': 'Back to the list' }, '‹ ' + (project || 'Back')));
  const updates = [], nodes = [];
  for (const c of msg.controls) {
    const [node, update] = control(msg.op, c);
    // Buttons in a row share a line (Previous / Next) instead of stacking full width.
    const prev = nodes[nodes.length - 1];
    if (node.classList.contains('ghost')) {
      if (prev && prev.classList.contains('btns')) prev.append(node);
      else nodes.push(el('div', { class: 'btns' }, node));
    } else nodes.push(node);
    updates.push(update); update(c);
  }
  panel = { sig, updates };
  const onair = el('span', { id: 'onair', class: 'onair' }, 'ON AIR');
  onair.hidden = msg.op !== live;
  main.replaceChildren(el('div', { class: 'card' }, el('h1', {}, label, onair), ...nodes));
  scrollTo(0, 0);
}

function set(op, c, value) { lastSet = c.label; return send({ type: 'set', op, par: c.name, value }); }

function fmt(v, c) {
  if (c.style === 'Int') return String(v);
  const r = (c.max ?? 1) - (c.min ?? 0);
  return Number(v).toFixed(r >= 1000 ? 0 : r >= 10 ? 1 : r >= 1 ? 2 : 3);
}

// Plain text for read-only values: TouchDesigner names (snake_case) read as words.
function plain(v) { const s = String(v ?? ''); return /[/:.]/.test(s) ? s : s.replace(/_/g, ' '); }

function control(op, c) {
  const nothing = () => {};
  if (c.style === 'Header') return [el('div', { class: 'group' }, c.label.toUpperCase()), nothing];

  if (c.readOnly || (typeof c.value !== 'number' && !['Toggle', 'Momentary', 'Pulse', 'Menu', 'StrMenu'].includes(c.style))) {
    const v = el('span', { class: 'ro' });
    return [el('div', { class: 'row' }, el('span', {}, c.label), v), (n) => { v.textContent = plain(n.value); }];
  }

  if (c.style === 'Toggle') {
    // The whole row is the switch: label included, 44px tall.
    const row = el('button', { class: 'row toggle', role: 'switch', 'aria-checked': 'false' }, el('span', {}, c.label), el('span', { class: 'switch' }));
    let on = false;
    row.addEventListener('click', () => { if (set(op, c, !on)) { on = !on; row.setAttribute('aria-checked', on); } });
    return [row, (n) => { on = !!n.value; row.setAttribute('aria-checked', on); }];
  }

  if (c.style === 'Momentary') {
    const b = el('button', { class: 'ghost' }, c.label + ' (hold)');
    let held = false;
    const down = (e) => { e.preventDefault(); if (!held && set(op, c, true)) { held = true; b.classList.add('down'); } };
    const up = () => { if (held) { held = false; b.classList.remove('down'); set(op, c, false); } };
    b.addEventListener('pointerdown', down);
    ['pointerup', 'pointercancel', 'pointerleave'].forEach((t) => b.addEventListener(t, up));
    b.addEventListener('contextmenu', (e) => e.preventDefault());
    return [b, nothing];
  }

  if (c.style === 'Pulse') {
    const b = el('button', { class: 'ghost' }, c.label);
    b.addEventListener('click', () => { if (set(op, c)) { b.classList.add('down'); setTimeout(() => b.classList.remove('down'), 150); } });
    return [b, nothing];
  }

  if (c.style === 'Menu' || c.style === 'StrMenu') {
    // A menu often switches what's on the big screen, so every choice can be undone.
    let cur = c.value;
    const btns = (c.options || []).map(([name, lbl]) => {
      const b = el('button', { 'aria-pressed': 'false' }, lbl);
      b.addEventListener('click', () => {
        if (name === cur) return;
        const prev = cur;
        if (set(op, c, name)) toast(`${c.label}: ${lbl}`, () => set(op, c, prev));
      });
      b.dataset.name = name;
      return b;
    });
    return [el('div', { class: 'ctl' }, el('span', {}, c.label), el('div', { class: 'segs' }, ...btns)),
      (n) => { cur = n.value; btns.forEach((b) => b.setAttribute('aria-pressed', b.dataset.name === n.value)); }];
  }

  const min = c.min ?? 0, max = c.max ?? 1, isInt = c.style === 'Int';
  const v = el('span', { class: 'val' });
  // Reset shows once you've moved a control away from its default, and can be undone.
  const reset = el('button', { class: 'reset', hidden: '' }, 'Reset');
  let value = c.value, touched = false;
  const showReset = () => { reset.hidden = !touched || c.default === undefined || Math.abs(value - c.default) <= (max - min) / 1000; };
  reset.addEventListener('click', () => {
    const prev = value;
    if (set(op, c, c.default)) toast(`${c.label} reset`, () => set(op, c, prev));
  });

  if (isInt) {
    const nudge = (d) => {
      const next = Math.min(max, Math.max(min, value + d));
      if (next === value || !set(op, c, next)) return;
      value = next; touched = true; v.textContent = value; showReset();
    };
    const node = el('div', { class: 'ctl' },
      el('div', { class: 'row' }, el('span', {}, c.label), reset),
      el('div', { class: 'step' },
        el('button', { onclick: () => nudge(-1), 'aria-label': c.label + ' down' }, '−'), v,
        el('button', { onclick: () => nudge(1), 'aria-label': c.label + ' up' }, '+')));
    return [node, (n) => { value = n.value; v.textContent = value; showReset(); }];
  }

  // Float: a slider that moves by how far you drag (no jump to where you touch), sending at most
  // every 50 ms while it moves and once more when it's let go.
  const slider = el('div', { class: 'slider', role: 'slider', tabindex: '0', 'aria-label': c.label, 'aria-valuemin': min, 'aria-valuemax': max },
    el('div', { class: 'fill' }), el('div', { class: 'thumb' }));
  let dragging = false, start = null, last = 0, timer = null;
  const draw = () => {
    const p = max > min ? Math.min(1, Math.max(0, (value - min) / (max - min))) : 0;
    slider.style.setProperty('--p', p);
    slider.setAttribute('aria-valuenow', value);
    v.textContent = fmt(value, c);
  };
  const move = (next) => {
    value = Math.min(max, Math.max(min, next)); touched = true; draw(); showReset();
    const now = Date.now(); clearTimeout(timer);
    if (now - last > 50) { last = now; set(op, c, value); }
    else timer = setTimeout(() => { last = Date.now(); set(op, c, value); }, 50);
  };
  const end = () => {
    if (dragging) { clearTimeout(timer); set(op, c, value); }
    dragging = false; start = null; slider.classList.remove('active');
  };
  slider.addEventListener('pointerdown', (e) => { start = { x: e.clientX, y: e.clientY, v: value, w: slider.clientWidth - 28 }; });
  slider.addEventListener('pointermove', (e) => {
    if (!start) return;
    const dx = e.clientX - start.x;
    if (!dragging) {
      if (Math.abs(dx) < 8) return;
      if (Math.abs(e.clientY - start.y) > Math.abs(dx)) { start = null; return; } // a scroll, not a drag
      dragging = true; slider.classList.add('active'); slider.setPointerCapture(e.pointerId);
    }
    move(start.v + (dx / start.w) * (max - min));
  });
  slider.addEventListener('pointerup', end);
  slider.addEventListener('pointercancel', end);
  slider.addEventListener('keydown', (e) => {
    const d = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key];
    if (!d) return;
    e.preventDefault(); move(value + d * (max - min) / 100); clearTimeout(timer); set(op, c, value);
  });
  const node = el('div', { class: 'ctl' },
    el('div', { class: 'row' }, el('span', {}, c.label), el('span', {}, reset, ' ', v)), slider);
  return [node, (n) => { if (dragging) return; value = n.value; draw(); showReset(); }];
}

connect();
</script>
</body>
</html>
